name: Build ImmortalWrt for Cudy TR3000 512MB

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths-ignore:
      - '**.md'

env:
  REPO_URL: https://github.com/immortalwrt/immortalwrt
  REPO_BRANCH: openwrt-24.10
  DEVICE_TARGET: mediatek
  DEVICE_SUBTARGET: filogic
  DEVICE_PROFILE: cudy_tr3000-v1-ubootmod
  UPLOAD_FIRMWARE: true
  UPLOAD_RELEASE: true

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Initialization environment
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo -E apt-get update
          sudo -E apt-get install -y build-essential clang flex bison g++ gawk gcc-multilib g++-multilib gettext git libncurses5-dev libssl-dev python3-distutils rsync unzip zlib1g-dev file wget curl ccache
          sudo timedatectl set-timezone Asia/Shanghai

      - name: Clone source code
        run: |
          git clone $REPO_URL -b $REPO_BRANCH --single-branch --depth 1 openwrt
          # 锁定接近 24.10.6 的提交（可根据需要调整）
          # cd openwrt && git checkout <具体commit> && cd ..

      - name: Load custom feeds & diy scripts
        run: |
          cd openwrt
          chmod +x ../diy-part1.sh ../diy-part2.sh
          ../diy-part1.sh
          ./scripts/feeds update -a
          ./scripts/feeds install -a
          ../diy-part2.sh

      - name: Download package
        run: |
          cd openwrt
          make download -j8
          find dl -size -1024c -exec ls -l {} \;
          find dl -size -1024c -exec rm -f {} \;

      - name: Compile firmware
        id: compile
        run: |
          cd openwrt
          make defconfig
          make -j$(nproc) || make -j1 V=s
          echo "status=success" >> $GITHUB_OUTPUT
          echo "FILE_DATE=$(date +'%Y%m%d%H%M')" >> $GITHUB_ENV

      - name: Upload firmware to Artifacts
        uses: actions/upload-artifact@v4
        if: steps.compile.outputs.status == 'success'
        with:
          name: ImmortalWrt_Cudy_TR3000_512MB_${{ env.FILE_DATE }}
          path: openwrt/bin/targets/mediatek/filogic/*.bin
          retention-days: 30

      - name: Generate release
        if: env.UPLOAD_RELEASE == 'true' && steps.compile.outputs.status == 'success'
        run: |
          cd openwrt/bin/targets/mediatek/filogic
          echo "ImmortalWrt 24.10 for Cudy TR3000 v1 (512MB hardmod)" > release.txt
          echo "Build date: $(date)" >> release.txt
          echo "UBI: ~490MB" >> release.txt
