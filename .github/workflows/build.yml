name: Build ImmortalWrt for Cudy TR3000 512MB

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths-ignore:
      - '**.md'
      - 'README.md'

env:
  REPO_URL: https://github.com/immortalwrt/immortalwrt
  REPO_BRANCH: openwrt-24.10
  DEVICE_TARGET: mediatek
  DEVICE_SUBTARGET: filogic
  DEVICE_PROFILE: cudy_tr3000-v1-ubootmod

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Initialization environment
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo -E apt-get update
          sudo -E apt-get install -y build-essential clang flex bison g++ gawk \
            gcc-multilib g++-multilib gettext git libncurses5-dev libssl-dev \
            python3-distutils rsync unzip zlib1g-dev file wget curl ccache
          sudo timedatectl set-timezone Asia/Shanghai

      - name: Clone ImmortalWrt source
        run: |
          git clone $REPO_URL -b $REPO_BRANCH --single-branch --depth 1 openwrt

      - name: Load custom feeds and diy scripts
        run: |
          cd openwrt
          chmod +x ../diy-part1.sh ../diy-part2.sh
          ../diy-part1.sh
          ./scripts/feeds update -a
          ./scripts/feeds install -a
          ../diy-part2.sh

      - name: Download packages
        run: |
          cd openwrt
          make download -j8
          find dl -size -1024c -exec ls -l {} \;
          find dl -size -1024c -exec rm -f {} \;

      - name: Compile firmware
        id: compile
        run: |
          cd openwrt
          make defconfig
          make -j$(nproc) || make -j1 V=s
          echo "status=success" >> $GITHUB_OUTPUT
          echo "FILE_DATE=$(date +'%Y%m%d%H%M')" >> $GITHUB_ENV

      - name: Organize firmware files
        if: steps.compile.outputs.status == 'success'
        run: |
          mkdir -p firmware
          cd openwrt/bin/targets/mediatek/filogic
          # 复制常用固件文件
          cp -f *sysupgrade*.bin ../../../firmware/ 2>/dev/null || true
          cp -f *sysupgrade*.itb ../../../firmware/ 2>/dev/null || true
          cp -f *.manifest ../../../firmware/ 2>/dev/null || true
          # 生成说明文件
          echo "ImmortalWrt 24.10 for Cudy TR3000 v1 (512MB Hardmod)" > ../../../firmware/release-info.txt
          echo "Build time: $(date)" >> ../../../firmware/release-info.txt
          echo "UBI size: ~490MB" >> ../../../firmware/release-info.txt
          echo "SSR Plus+: Xray only + Nftables transparent proxy" >> ../../../firmware/release-info.txt
          ls -lh ../../../firmware/

      - name: Upload firmware to Artifacts
        uses: actions/upload-artifact@v4
        if: steps.compile.outputs.status == 'success'
        with:
          name: ImmortalWrt_Cudy_TR3000_512MB_${{ env.FILE_DATE }}
          path: firmware/*
          retention-days: 30

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: steps.compile.outputs.status == 'success'
        with:
          tag_name: ImmortalWrt-24.10-${{ env.FILE_DATE }}
          name: ImmortalWrt 24.10 · Cudy TR3000 512MB (${{ env.FILE_DATE }})
          body: |
            ### ImmortalWrt 24.10 for Cudy TR3000 v1（硬改 512MB）

            **主要特性：**
            - 基于 ImmortalWrt `openwrt-24.10`
            - UBI 分区扩大至约 **490MB**
            - 预装 **luci-theme-argon** + argon-config
            - 预装 **SSR Plus+（仅 Xray 内核）** + Nftables 透明代理完整依赖
            - 预装 UPnP IGD + PCP/NAT-PMP
            - 预装 mwan3 双 WAN 自动切换（有线 WAN 优先，USB 备用）
            - 预装中兴 F50 USB 网络驱动（RNDIS / CDC-Ether）
            - 预装 openssh-sftp-server、ttyd、htop 等实用工具
            - 首次启动预设：无登录密码、LAN 192.168.1.1、WiFi 开启（SSID: Cudy / Cudy-5G）

            **刷机说明：**
            请使用已刷好的 3 分区 U-Boot 进行刷写。推荐刷写 `*sysupgrade*.bin` 或 `.itb` 文件。
          files: firmware/*
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
