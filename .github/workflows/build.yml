name: Build ImmortalWrt for Cudy TR3000 512MB

on:
  workflow_dispatch:          # 仅手动触发

env:
  REPO_URL: https://github.com/immortalwrt/immortalwrt
  REPO_BRANCH: openwrt-24.10

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Initialization environment
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo -E apt-get update
          sudo -E apt-get install -y build-essential clang flex bison g++ gawk \
            gcc-multilib g++-multilib gettext git libncurses5-dev libssl-dev \
            python3-distutils rsync unzip zlib1g-dev file wget curl ccache
          sudo timedatectl set-timezone Asia/Shanghai

      - name: Clone ImmortalWrt source
        run: |
          git clone $REPO_URL -b $REPO_BRANCH --single-branch --depth 1 openwrt

      - name: Create diy scripts and custom files
        run: |
          cd openwrt

          # ========== 创建 diy-part1.sh ==========
          cat > diy-part1.sh << 'EOF'
          #!/bin/bash
          # 添加 helloworld
          sed -i "/helloworld/d" "feeds.conf.default"
          echo "src-git helloworld https://github.com/fw876/helloworld.git" >> "feeds.conf.default"

          # Argon 主题
          git clone --depth=1 https://github.com/jerrykuku/luci-theme-argon.git package/luci-theme-argon
          git clone --depth=1 https://github.com/jerrykuku/luci-app-argon-config.git package/luci-app-argon-config
          EOF
          chmod +x diy-part1.sh

          # ========== 创建 diy-part2.sh ==========
          cat > diy-part2.sh << 'EOF'
          #!/bin/bash

          # 扩大 UBI 到约 490MB
          sed -i 's/reg = <0x5c0000 0x7a40000>;/reg = <0x5c0000 0x1EA00000>;/' target/linux/mediatek/dts/mt7981b-cudy-tr3000-v1-ubootmod.dts

          # 写入配置
          cat >> .config << 'EOC'
          CONFIG_TARGET_mediatek=y
          CONFIG_TARGET_mediatek_filogic=y
          CONFIG_TARGET_mediatek_filogic_DEVICE_cudy_tr3000-v1-ubootmod=y

          # 官方默认包
          CONFIG_PACKAGE_autocore=y
          CONFIG_PACKAGE_base-files=y
          CONFIG_PACKAGE_block-mount=y
          CONFIG_PACKAGE_bridger=y
          CONFIG_PACKAGE_ca-bundle=y
          CONFIG_PACKAGE_default-settings-chn=y
          CONFIG_PACKAGE_dnsmasq-full=y
          CONFIG_PACKAGE_dropbear=y
          CONFIG_PACKAGE_firewall4=y
          CONFIG_PACKAGE_fitblk=y
          CONFIG_PACKAGE_fstools=y
          CONFIG_PACKAGE_kmod-crypto-hw-safexcel=y
          CONFIG_PACKAGE_kmod-gpio-button-hotplug=y
          CONFIG_PACKAGE_kmod-leds-gpio=y
          CONFIG_PACKAGE_kmod-nf-nathelper=y
          CONFIG_PACKAGE_kmod-nf-nathelper-extra=y
          CONFIG_PACKAGE_kmod-nft-offload=y
          CONFIG_PACKAGE_kmod-phy-aquantia=y
          CONFIG_PACKAGE_libc=y
          CONFIG_PACKAGE_libgcc=y
          CONFIG_PACKAGE_libustream-openssl=y
          CONFIG_PACKAGE_logd=y
          CONFIG_PACKAGE_luci-app-package-manager=y
          CONFIG_PACKAGE_luci-compat=y
          CONFIG_PACKAGE_luci-lib-base=y
          CONFIG_PACKAGE_luci-lib-ipkg=y
          CONFIG_PACKAGE_luci-light=y
          CONFIG_PACKAGE_mtd=y
          CONFIG_PACKAGE_netifd=y
          CONFIG_PACKAGE_nftables=y
          CONFIG_PACKAGE_odhcp6c=y
          CONFIG_PACKAGE_odhcpd-ipv6only=y
          CONFIG_PACKAGE_opkg=y
          CONFIG_PACKAGE_ppp=y
          CONFIG_PACKAGE_ppp-mod-pppoe=y
          CONFIG_PACKAGE_procd-ujail=y
          CONFIG_PACKAGE_uboot-envtools=y
          CONFIG_PACKAGE_uci=y
          CONFIG_PACKAGE_uclient-fetch=y
          CONFIG_PACKAGE_urandom-seed=y
          CONFIG_PACKAGE_urngd=y
          CONFIG_PACKAGE_wpad-openssl=y
          CONFIG_PACKAGE_kmod-usb3=y
          CONFIG_PACKAGE_kmod-mt7915e=y
          CONFIG_PACKAGE_kmod-mt7981-firmware=y
          CONFIG_PACKAGE_mt7981-wo-firmware=y
          CONFIG_PACKAGE_automount=y

          # Argon 主题
          CONFIG_PACKAGE_luci-theme-argon=y
          CONFIG_PACKAGE_luci-app-argon-config=y

          # UPnP
          CONFIG_PACKAGE_luci-app-upnp=y
          CONFIG_PACKAGE_miniupnpd-nftables=y

          # SSR Plus+ 仅 Xray + Nftables
          CONFIG_PACKAGE_luci-app-ssr-plus=y
          CONFIG_PACKAGE_luci-app-ssr-plus_Nftables_Transparent_Proxy=y
          CONFIG_PACKAGE_luci-app-ssr-plus_INCLUDE_Xray=y
          CONFIG_PACKAGE_xray-core=y
          CONFIG_PACKAGE_v2ray-geoip=y
          CONFIG_PACKAGE_v2ray-geosite=y
          CONFIG_PACKAGE_ipt2socks=y
          CONFIG_PACKAGE_dns2tcp=y
          CONFIG_PACKAGE_microsocks=y
          CONFIG_PACKAGE_chinadns-ng=y

          # USB 网络驱动（中兴 F50）
          CONFIG_PACKAGE_kmod-mii=y
          CONFIG_PACKAGE_kmod-usb-net=y
          CONFIG_PACKAGE_kmod-usb-net-cdc-ether=y
          CONFIG_PACKAGE_kmod-usb-net-rndis=y

          # SFTP
          CONFIG_PACKAGE_openssh-sftp-server=y

          # 额外实用工具
          CONFIG_PACKAGE_luci-app-ttyd=y
          CONFIG_PACKAGE_htop=y
          CONFIG_PACKAGE_curl=y
          CONFIG_PACKAGE_wget-ssl=y
          CONFIG_PACKAGE_nano=y
          CONFIG_PACKAGE_tcpdump=y
          CONFIG_PACKAGE_iperf3=y
          EOC

          make defconfig
          EOF
          chmod +x diy-part2.sh

          # ========== 创建首次启动脚本 ==========
          mkdir -p files/etc/uci-defaults
          cat > files/etc/uci-defaults/99-custom << 'EOF'
          #!/bin/sh

          # 无登录密码
          passwd -d root

          # 关闭 IPv6（提升透明代理稳定性）
          uci set network.wan.ipv6='0'
          uci set network.lan.ipv6='0'
          uci set dhcp.lan.dhcpv6='disabled'
          uci set dhcp.lan.ra='disabled'
          uci set dhcp.lan.ndp='disabled'
          uci commit network
          uci commit dhcp

          # 开启 WiFi 并设置 SSID
          uci set wireless.radio0.disabled='0'
          uci set wireless.default_radio0.ssid='Cudy'
          uci set wireless.default_radio0.encryption='psk2'
          uci set wireless.default_radio0.key='password'

          uci set wireless.radio1.disabled='0'
          uci set wireless.default_radio1.ssid='Cudy-5G'
          uci set wireless.default_radio1.encryption='psk2'
          uci set wireless.default_radio1.key='password'
          uci commit wireless

          # 添加 F50 接口（识别为 eth2）
          uci set network.usbwan=interface
          uci set network.usbwan.proto='dhcp'
          uci set network.usbwan.device='eth2'
          uci set network.usbwan.metric='20'
          uci commit network

          # 把 usbwan 加入 wan 防火墙区域
          uci add_list firewall.@zone[1].network='usbwan'
          uci commit firewall

          # 开启 UPnP
          uci set upnpd.config.enabled='1'
          uci commit upnpd

          exit 0
          EOF
          chmod +x files/etc/uci-defaults/99-custom

      - name: Update feeds and run diy
        run: |
          cd openwrt
          ./diy-part1.sh
          ./scripts/feeds update -a
          ./scripts/feeds install -a
          ./diy-part2.sh

      - name: Download packages
        run: |
          cd openwrt
          make download -j8
          find dl -size -1024c -exec rm -f {} \;

      - name: Compile firmware
        id: compile
        run: |
          cd openwrt
          make -j$(nproc) || make -j1 V=s
          echo "status=success" >> $GITHUB_OUTPUT
          echo "FILE_DATE=$(date +'%Y%m%d%H%M')" >> $GITHUB_ENV

      - name: Organize firmware files
        if: steps.compile.outputs.status == 'success'
        run: |
          mkdir -p firmware
          cd openwrt/bin/targets/mediatek/filogic

          # 使用绝对路径，避免相对路径错误
          cp -f *sysupgrade*.bin $GITHUB_WORKSPACE/firmware/ 2>/dev/null || true
          cp -f *sysupgrade*.itb $GITHUB_WORKSPACE/firmware/ 2>/dev/null || true
          cp -f *.manifest $GITHUB_WORKSPACE/firmware/ 2>/dev/null || true

          echo "=== Firmware files ==="
          ls -lh $GITHUB_WORKSPACE/firmware/

      - name: Upload firmware to Artifacts
        uses: actions/upload-artifact@v4
        if: steps.compile.outputs.status == 'success'
        with:
          name: ImmortalWrt_Cudy_TR3000_512MB_${{ env.FILE_DATE }}
          path: firmware/*
          retention-days: 30

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: steps.compile.outputs.status == 'success'
        with:
          tag_name: ImmortalWrt-24.10-${{ env.FILE_DATE }}
          name: ImmortalWrt 24.10 · Cudy TR3000 512MB (${{ env.FILE_DATE }})
          body: |
            ### ImmortalWrt 24.10 for Cudy TR3000 v1（硬改 512MB）
            - UBI ≈ 490MB
            - Argon 主题
            - SSR Plus+（仅 Xray）+ Nftables 透明代理
            - UPnP
            - 中兴 F50 支持（识别为 eth2）
            - 默认关闭 IPv6（提升透明代理稳定性）
            - 首次启动无密码，WiFi：Cudy / Cudy-5G
            - 插网线走有线，插 F50 走 eth2
          files: firmware/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
