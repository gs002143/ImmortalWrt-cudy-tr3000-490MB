name: Build OpenWrt 25.12.5 for Cudy TR3000 v1 (SSR Plus+ only + Xray + 4G + 强制490MB UBI + disable IPv6)

on:
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 240

    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/boost /opt/hostedtoolcache/CodeQL
          sudo apt-get clean
          df -h

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison g++ gawk gcc-multilib g++-multilib gettext git libncurses5-dev libssl-dev python3-setuptools rsync swig unzip zlib1g-dev file wget curl qemu-utils libelf-dev

      - name: Clone OpenWrt 25.12.5 stable
        run: |
          git clone --depth=1 --branch v25.12.5 https://github.com/openwrt/openwrt.git openwrt

      - name: Patch DTS for 490MB UBI (512MB flash mod) - MUST succeed
        working-directory: openwrt
        run: |
          set -e
          DTS_FILE=$(find target/linux/mediatek/dts -name "mt7981b-cudy-tr3000-v1.dts" | head -1)
          echo "=== DTS file found: $DTS_FILE ==="
          if [ -z "$DTS_FILE" ]; then
            echo "ERROR: mt7981b-cudy-tr3000-v1.dts not found!"
            find target/linux/mediatek/dts -name "*cudy*" -o -name "*tr3000*" || true
            exit 1
          fi

          echo "=== Original UBI section ==="
          grep -A5 -E "ubi|&ubi" "$DTS_FILE" || true

          # 强制替换：0x4000000 (64MB) → 0x1EA00000 (490MB)
          # 同时覆盖可能的写法
          sed -i 's/reg = <0x5c0000 0x4000000>/reg = <0x5c0000 0x1EA00000>/g' "$DTS_FILE"
          sed -i 's/0x4000000/0x1EA00000/g' "$DTS_FILE"

          echo "=== After patch ==="
          grep -n "0x1EA00000\|0x4000000\|ubi\|reg =" "$DTS_FILE" || true

          # 验证必须成功
          if ! grep -q "0x1EA00000" "$DTS_FILE"; then
            echo "ERROR: Failed to patch UBI size to 0x1EA00000 (490MB)!"
            cat "$DTS_FILE"
            exit 1
          fi
          if grep -q "0x4000000" "$DTS_FILE"; then
            echo "ERROR: Still contains 0x4000000 after patch!"
            exit 1
          fi
          echo "SUCCESS: UBI partition size set to 0x1EA00000 (490MB)"

      - name: Setup feeds (SSR Plus+ only)
        working-directory: openwrt
        run: |
          echo "src-git helloworld https://github.com/fw876/helloworld.git" >> feeds.conf.default
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Add argon theme
        working-directory: openwrt
        run: |
          git clone --depth=1 https://github.com/jerrykuku/luci-theme-argon.git package/luci-theme-argon || true

      - name: Write .config
        working-directory: openwrt
        run: |
          rm -f .config
          cat > .config << 'EOF'
CONFIG_TARGET_mediatek=y
CONFIG_TARGET_mediatek_filogic=y
CONFIG_TARGET_mediatek_filogic_DEVICE_cudy_tr3000-v1=y
CONFIG_PACKAGE_autocore=y
CONFIG_PACKAGE_base-files=y
CONFIG_PACKAGE_block-mount=y
CONFIG_PACKAGE_ca-bundle=y
CONFIG_PACKAGE_dnsmasq=n
CONFIG_PACKAGE_dnsmasq-full=y
CONFIG_PACKAGE_dropbear=y
CONFIG_PACKAGE_firewall4=y
CONFIG_PACKAGE_fstools=y
CONFIG_PACKAGE_kmod-crypto-hw-safexcel=y
CONFIG_PACKAGE_kmod-gpio-button-hotplug=y
CONFIG_PACKAGE_kmod-leds-gpio=y
CONFIG_PACKAGE_kmod-nf-nathelper=y
CONFIG_PACKAGE_kmod-nf-nathelper-extra=y
CONFIG_PACKAGE_kmod-nft-offload=y
CONFIG_PACKAGE_kmod-phy-aquantia=y
CONFIG_PACKAGE_libc=y
CONFIG_PACKAGE_libgcc=y
CONFIG_PACKAGE_libustream-openssl=y
CONFIG_PACKAGE_logd=y
CONFIG_PACKAGE_luci=y
CONFIG_PACKAGE_luci-compat=y
CONFIG_PACKAGE_luci-lib-base=y
CONFIG_PACKAGE_luci-light=y
CONFIG_PACKAGE_mtd=y
CONFIG_PACKAGE_netifd=y
CONFIG_PACKAGE_nftables=y
CONFIG_PACKAGE_odhcp6c=y
CONFIG_PACKAGE_odhcpd-ipv6only=y
CONFIG_PACKAGE_ppp=y
CONFIG_PACKAGE_ppp-mod-pppoe=y
CONFIG_PACKAGE_procd-ujail=y
CONFIG_PACKAGE_uboot-envtools=y
CONFIG_PACKAGE_uci=y
CONFIG_PACKAGE_uclient-fetch=y
CONFIG_PACKAGE_urandom-seed=y
CONFIG_PACKAGE_urngd=y
CONFIG_PACKAGE_wpad-openssl=y
CONFIG_PACKAGE_kmod-usb3=y
CONFIG_PACKAGE_kmod-mt7915e=y
CONFIG_PACKAGE_kmod-mt7981-firmware=y
CONFIG_PACKAGE_mt7981-wo-firmware=y
CONFIG_PACKAGE_automount=y
CONFIG_PACKAGE_luci-theme-argon=y
CONFIG_PACKAGE_luci-app-upnp=y
CONFIG_PACKAGE_miniupnpd-nftables=y
CONFIG_PACKAGE_kmod-nft-nat=y
CONFIG_PACKAGE_kmod-nf-nat=y
CONFIG_PACKAGE_kmod-nft-core=y
CONFIG_PACKAGE_kmod-nft-fib=y
CONFIG_PACKAGE_kmod-mii=y
CONFIG_PACKAGE_kmod-usb-net=y
CONFIG_PACKAGE_kmod-usb-net-cdc-ether=y
CONFIG_PACKAGE_kmod-usb-net-rndis=y
CONFIG_PACKAGE_kmod-usb-storage=y
CONFIG_PACKAGE_kmod-usb-storage-uas=y
CONFIG_PACKAGE_kmod-scsi-core=y
CONFIG_PACKAGE_kmod-fs-ext4=y
CONFIG_PACKAGE_kmod-fs-exfat=y
CONFIG_PACKAGE_kmod-fs-vfat=y
CONFIG_PACKAGE_kmod-nls-utf8=y
CONFIG_PACKAGE_kmod-nls-cp437=y
CONFIG_PACKAGE_kmod-nls-iso8859-1=y
CONFIG_PACKAGE_e2fsprogs=y
CONFIG_PACKAGE_kmod-nf-socket=y
CONFIG_PACKAGE_kmod-nft-socket=y
CONFIG_PACKAGE_kmod-nft-tproxy=y
CONFIG_PACKAGE_kmod-nf-tproxy=y
CONFIG_PACKAGE_kmod-tun=y
CONFIG_PACKAGE_kmod-inet-diag=y
CONFIG_PACKAGE_kmod-dummy=y
CONFIG_PACKAGE_kmod-nf-conntrack-netlink=y
CONFIG_PACKAGE_luci-app-ssr-plus=y
CONFIG_PACKAGE_luci-app-ssr-plus_INCLUDE_Xray=y
CONFIG_PACKAGE_luci-app-ssr-plus_INCLUDE_NONE_V2RAY=y
CONFIG_PACKAGE_luci-app-ssr-plus_INCLUDE_V2ray=n
CONFIG_PACKAGE_luci-app-ssr-plus_INCLUDE_ChinaDNS_NG=y
CONFIG_PACKAGE_xray-core=y
CONFIG_PACKAGE_chinadns-ng=y
CONFIG_PACKAGE_v2ray-geoip=y
CONFIG_PACKAGE_v2ray-geosite=y
CONFIG_PACKAGE_ip-full=y
CONFIG_PACKAGE_curl=y
CONFIG_PACKAGE_openssh-sftp-server=y
CONFIG_PACKAGE_kmod-usb-serial=y
CONFIG_PACKAGE_kmod-usb-serial-option=y
CONFIG_PACKAGE_kmod-usb-serial-wwan=y
CONFIG_PACKAGE_kmod-usb-net-qmi-wwan=y
CONFIG_PACKAGE_kmod-usb-net-cdc-mbim=y
CONFIG_PACKAGE_kmod-usb-net-cdc-ncm=y
CONFIG_PACKAGE_kmod-usb-wdm=y
CONFIG_PACKAGE_luci-proto-qmi=y
CONFIG_PACKAGE_luci-proto-mbim=y
EOF
          make defconfig

      - name: Write first-boot script
        working-directory: openwrt
        run: |
          mkdir -p files/etc/uci-defaults
          cat > files/etc/uci-defaults/99-custom-init.sh << 'ENDOFFILE'
#!/bin/sh
passwd -d root
uci set network.lan.ipaddr='192.168.1.1'
uci set network.lan.netmask='255.255.255.0'
uci commit network

# 默认屏蔽 IPv6
uci set network.lan.ipv6='0'
uci set network.wan.ipv6='0'
uci -q delete network.wan6 || true
uci set dhcp.lan.dhcpv6='disabled'
uci set dhcp.lan.ra='disabled'
uci set dhcp.lan.ndp='disabled'
uci set dhcp.lan.ra_slaac='0'
uci commit network
uci commit dhcp
mkdir -p /etc/sysctl.d
echo "net.ipv6.conf.all.disable_ipv6 = 1" > /etc/sysctl.d/99-disable-ipv6.conf
echo "net.ipv6.conf.default.disable_ipv6 = 1" >> /etc/sysctl.d/99-disable-ipv6.conf
echo "net.ipv6.conf.lo.disable_ipv6 = 1" >> /etc/sysctl.d/99-disable-ipv6.conf
sysctl -p /etc/sysctl.d/99-disable-ipv6.conf 2>/dev/null || true

uci set wireless.@wifi-device[0].disabled='0' 2>/dev/null || true
uci set wireless.@wifi-iface[0].disabled='0' 2>/dev/null || true
uci set wireless.@wifi-iface[0].ssid='Cudy' 2>/dev/null || true
uci set wireless.@wifi-iface[0].encryption='none' 2>/dev/null || true
uci set wireless.@wifi-device[1].disabled='0' 2>/dev/null || true
uci set wireless.@wifi-iface[1].disabled='0' 2>/dev/null || true
uci set wireless.@wifi-iface[1].ssid='Cudy-5G' 2>/dev/null || true
uci set wireless.@wifi-iface[1].encryption='none' 2>/dev/null || true
uci commit wireless 2>/dev/null || true
wifi up 2>/dev/null || true

uci set luci.main.mediaurlbase='/luci-static/argon' 2>/dev/null || true
uci commit luci 2>/dev/null || true

exit 0
ENDOFFILE
          chmod +x files/etc/uci-defaults/99-custom-init.sh

      - name: Download source packages
        working-directory: openwrt
        run: |
          make download -j$(nproc) V=s 2>&1 | grep -E "ERROR|error" || true

      - name: Build firmware
        working-directory: openwrt
        run: |
          make -j$(nproc) V=s 2>&1 | tee build.log | grep -E "^(make\[|ERROR|WARNING|Compiling|Building)" || true

      - name: Check build output
        working-directory: openwrt
        run: |
          echo "=== Firmware files ==="
          ls -lh bin/targets/mediatek/filogic/ | grep -i "cudy\|tr3000" || ls -lh bin/targets/mediatek/filogic/ || true
          echo "=== Key packages ==="
          find bin/packages -name "*ssr-plus*" -o -name "*xray*" -o -name "*chinadns*" 2>/dev/null | head -20 || true

      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: openwrt-25.12.5-cudy-tr3000-v1-ssrplus-xray-490MB
          path: |
            openwrt/bin/targets/mediatek/filogic/*cudy*
            openwrt/bin/targets/mediatek/filogic/*tr3000*
          if-no-files-found: warn
          retention-days: 14

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v25.12.5-ssrplus-xray-490MB-${{ github.run_number }}
          name: OpenWrt 25.12.5 Cudy TR3000 v1 - SSR Plus+ (Xray) + 强制490MB UBI + 4G + disable IPv6 Build ${{ github.run_number }}
          body: |
            官方 OpenWrt 25.12.5 自定义固件（Cudy TR3000 v1）

            ✅ 主用代理：
            - **ShadowSocksR Plus+**（https://github.com/fw876/helloworld）
            - **仅 Xray 内核**
            - chinadns-ng

            ❌ 已删除：PassWall / Nikki / MosDNS

            ✅ **强制 490MB UBI 分区**（针对 512MB 闪存硬改）
            - DTS 中 `reg = <0x5c0000 0x1EA00000>`
            - 补丁失败会直接中断编译，不会跳过

            ✅ 其他：
            - 默认屏蔽 IPv6
            - Argon 主题
            - 4G/5G USB 模块驱动
            - dnsmasq-full + tproxy/nftables

            注意：OpenWrt 25.12 默认使用 **apk** 包管理器。
          files: |
            openwrt/bin/targets/mediatek/filogic/*cudy*
            openwrt/bin/targets/mediatek/filogic/*tr3000*
          draft: false
          prerelease: false

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-error
          path: openwrt/build.log
          retention-days: 7
