name: Build ImmortalWrt 24.10.6 Cudy TR3000 v1 PassWall SSRPlus Xray 490MB-UBI

on:
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 360

    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/boost /opt/hostedtoolcache/CodeQL
          sudo apt-get clean
          df -h

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison g++ gawk gcc-multilib g++-multilib gettext git libncurses5-dev libssl-dev python3-setuptools rsync swig unzip zlib1g-dev file wget curl qemu-utils libelf-dev

      - name: Clone ImmortalWrt 24.10.6
        run: |
          git clone --depth=1 --branch v24.10.6 https://github.com/immortalwrt/immortalwrt.git openwrt

      - name: Patch UBI 490MB
        working-directory: openwrt
        run: |
          set -e
          DTS_FILE=$(find target/linux/mediatek/dts -name "mt7981b-cudy-tr3000-v1.dts" | head -1)
          test -n "$DTS_FILE"
          sed -i 's/0x4000000/0x1EA00000/g' "$DTS_FILE"

          MK_FILE="target/linux/mediatek/image/filogic.mk"
          sed -i 's/IMAGE_SIZE := 65536k/IMAGE_SIZE := 502784k/' "$MK_FILE"

      - name: Setup feeds
        working-directory: openwrt
        run: |
          sed -i '/helloworld/d' feeds.conf.default
          echo 'src-git helloworld https://github.com/fw876/helloworld.git;master' >> feeds.conf.default
          echo 'src-git passwall_packages https://github.com/xiaorouji/openwrt-passwall-packages.git' >> feeds.conf.default
          echo 'src-git passwall https://github.com/Openwrt-Passwall/openwrt-passwall.git' >> feeds.conf.default
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Add Argon theme
        working-directory: openwrt
        run: |
          git clone --depth=1 https://github.com/jerrykuku/luci-theme-argon.git package/luci-theme-argon || true

      - name: Write config
        working-directory: openwrt
        run: |
          cat > .config <<'CONFIG'
          CONFIG_TARGET_mediatek=y
          CONFIG_TARGET_mediatek_filogic=y
          CONFIG_TARGET_mediatek_filogic_DEVICE_cudy_tr3000-v1=y

          CONFIG_PACKAGE_luci=y
          CONFIG_PACKAGE_luci-theme-argon=y
          CONFIG_PACKAGE_luci-app-argon-config=y

          CONFIG_PACKAGE_kmod-mt76=y
          CONFIG_PACKAGE_kmod-mt76-connac=y
          CONFIG_PACKAGE_kmod-mt7981-firmware=y
          CONFIG_PACKAGE_mt7981-wo-firmware=y

          CONFIG_PACKAGE_dnsmasq-full=y
          CONFIG_PACKAGE_dropbear=y
          CONFIG_PACKAGE_firewall4=y
          CONFIG_PACKAGE_nftables=y
          CONFIG_PACKAGE_ip-full=y

          CONFIG_PACKAGE_curl=y
          CONFIG_PACKAGE_ca-bundle=y
          CONFIG_PACKAGE_openssh-sftp-server=y
          CONFIG_PACKAGE_luci-app-ttyd=y
          CONFIG_PACKAGE_ttyd=y

          CONFIG_PACKAGE_luci-app-passwall=y
          CONFIG_PACKAGE_luci-app-passwall_INCLUDE_Xray=y
          CONFIG_PACKAGE_luci-app-ssr-plus=y
          CONFIG_PACKAGE_luci-app-ssr-plus_INCLUDE_Xray=y
          CONFIG_PACKAGE_xray-core=y
          CONFIG_PACKAGE_v2ray-geoip=y
          CONFIG_PACKAGE_v2ray-geosite=y

          CONFIG_PACKAGE_kmod-usb3=y
          CONFIG_PACKAGE_kmod-usb-net=y
          CONFIG_PACKAGE_kmod-usb-net-cdc-ether=y
          CONFIG_PACKAGE_kmod-usb-net-rndis=y
          CONFIG_PACKAGE_kmod-usb-net-qmi-wwan=y
          CONFIG_PACKAGE_kmod-usb-net-cdc-mbim=y
          CONFIG_PACKAGE_kmod-usb-net-cdc-ncm=y
          CONFIG_PACKAGE_kmod-usb-wdm=y
          CONFIG_PACKAGE_kmod-usb-serial=y
          CONFIG_PACKAGE_kmod-usb-serial-option=y
          CONFIG_PACKAGE_kmod-usb-serial-wwan=y
          CONFIG_PACKAGE_usb-modeswitch=y
          CONFIG_PACKAGE_uqmi=y
          CONFIG_PACKAGE_umbim=y

          CONFIG_PACKAGE_luci-proto-qmi=y
          CONFIG_PACKAGE_luci-proto-mbim=y

          # CONFIG_PACKAGE_odhcp6c is not set
          # CONFIG_PACKAGE_odhcpd-ipv6only is not set
          # CONFIG_PACKAGE_kmod-ipv6 is not set
          CONFIG_IPV6=n
          CONFIG_PACKAGE_docker=n
          CONFIG_PACKAGE_mihomo=n
          CONFIG_PACKAGE_openclash=n
          CONFIG_PACKAGE_luci-app-xray=n
          CONFIG_PACKAGE_sing-box=n
          CONFIG_PACKAGE_hysteria=n
          CONFIG_PACKAGE_naiveproxy=n
          CONFIG_PACKAGE_trojan=n
          CONFIG_PACKAGE_v2ray-core=n
          CONFIG_PACKAGE_simple-obfs=n
          CONFIG_PACKAGE_shadowsocks-libev=n
          CONFIG_PACKAGE_shadowsocksr-libev=n
          CONFIG_PACKAGE_kcptun=n
          CONFIG_PACKAGE_mosdns=n
          CONFIG_PACKAGE_kmod-mt7915e=n
          CONFIG_PACKAGE_luci-app-upnp=n
          CONFIG_PACKAGE_miniupnpd=n
          CONFIG_PACKAGE_odhcp6c=n
          CONFIG_PACKAGE_odhcpd-ipv6only=n
          CONFIG_PARTITION_SIZE=490
          CONFIG_TARGET_ROOTFS_PARTSIZE=490
          CONFIG

          sed -i 's/^          //' .config
          make defconfig

      - name: First boot settings
        working-directory: openwrt
        run: |
          mkdir -p files/etc/uci-defaults
          cat > files/etc/uci-defaults/99-cudy-init.sh <<'SCRIPT'
          #!/bin/sh
          echo "root:Cudy123456" | chpasswd
          uci set network.lan.ipaddr='192.168.1.1'
          uci delete network.wan6
          uci commit network
          uci set dhcp.lan.dhcpv6='disabled'
          uci set dhcp.lan.ra='disabled'
          uci commit dhcp
          mkdir -p /etc/sysctl.d
          echo 'net.ipv6.conf.all.disable_ipv6=1' >/etc/sysctl.d/99-disable-ipv6.conf
          uci set wireless.@wifi-iface[0].ssid='Cudy'
          uci set wireless.@wifi-iface[0].encryption='psk2'
          uci set wireless.@wifi-iface[0].key='Cudy123456'
          uci set wireless.@wifi-iface[1].ssid='Cudy-5G'
          uci set wireless.@wifi-iface[1].encryption='psk2'
          uci set wireless.@wifi-iface[1].key='Cudy123456'
          uci commit wireless
          wifi up
          exit 0
          SCRIPT
          sed -i 's/^          //' files/etc/uci-defaults/99-cudy-init.sh
          chmod +x files/etc/uci-defaults/99-cudy-init.sh

      - name: Build
        working-directory: openwrt
        run: |
          make -j$(nproc) V=s

      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: immortalwrt-24.10.6-cudy-tr3000-passwall-ssrplus-xray
          path: openwrt/bin/targets/mediatek/filogic/*
