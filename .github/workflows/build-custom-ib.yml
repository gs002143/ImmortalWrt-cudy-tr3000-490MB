name: Build Custom ImmortalWrt 24.10.6 ImageBuilder (490MB UBI) - Super Stable

on:
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  FORCE_UNSAFE_CONFIGURE: 1

permissions:
  contents: write

jobs:
  build-ib:
    runs-on: ubuntu-22.04
    timeout-minutes: 360

    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/boost /opt/hostedtoolcache
          sudo rm -rf /usr/share/swift /usr/local/.ghcup /opt/microsoft
          sudo apt-get clean
          sudo docker system prune -af || true
          df -h

      - name: Install dependencies + aria2
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential clang flex bison g++ gawk \
            gcc-multilib g++-multilib gettext git \
            libncurses5-dev libssl-dev python3-setuptools \
            rsync swig unzip zlib1g-dev file wget curl \
            qemu-utils libelf-dev time aria2

      - name: Clone ImmortalWrt
        run: |
          git clone --depth=1 --branch v24.10.6 https://github.com/immortalwrt/immortalwrt.git openwrt

      - name: Cache downloads (dl/)
        uses: actions/cache@v4
        with:
          path: openwrt/dl
          key: immortalwrt-dl-${{ github.run_id }}
          restore-keys: |
            immortalwrt-dl-

      - name: Force UBI 490MB patch
        working-directory: openwrt
        run: |
          set -e
          DTS=$(find target/linux/mediatek/dts -name "*cudy-tr3000-v1.dts" | head -1)
          echo "Patching $DTS"
          sed -i 's/reg = <0x5c0000 0x4000000>/reg = <0x5c0000 0x1EA00000>/g' "$DTS"
          sed -i 's/0x4000000/0x1EA00000/g' "$DTS"
          grep -q "0x1EA00000" "$DTS" || { echo "DTS patch failed"; exit 1; }

          MK=target/linux/mediatek/image/filogic.mk
          sed -i '/Device\/cudy_tr3000-v1/,/endef/{s/IMAGE_SIZE := 65536k/IMAGE_SIZE := 502784k/}' "$MK"
          grep -A15 "Device/cudy_tr3000-v1" "$MK" | grep -q "502784k" || { echo "IMAGE_SIZE patch failed"; exit 1; }
          echo "UBI patch success"

      - name: Super aggressive mirror + aria2 force
        working-directory: openwrt
        run: |
          find . -type f \( -name "*.mk" -o -name "download.pl" -o -name "*.sh" \) -exec sed -i \
            -e 's|https://github.com|https://mirror.ghproxy.com/https://github.com|g' \
            -e 's|https://downloads.openwrt.org|https://mirrors.tencent.com/openwrt|g' \
            -e 's|http://downloads.openwrt.org|https://mirrors.tencent.com/openwrt|g' \
            -e 's|https://cdn.kernel.org|https://mirrors.tencent.com/kernel|g' \
            -e 's|https://git.kernel.org|https://mirrors.tencent.com/kernel|g' \
            -e 's|download.savannah.nongnu.org|mirrors.tencent.com/nongnu|g' \
            -e 's|ftp.gnu.org|mirrors.tencent.com/gnu|g' \
            -e 's|ftpmirror.gnu.org|mirrors.tencent.com/gnu|g' \
            {} + || true

          sed -i 's/curl -f --connect-timeout [0-9]*/aria2c -x 16 -s 16 --connect-timeout=60 --max-tries=15 --retry-wait=5 -c -o/g' scripts/download.pl || true
          sed -i 's/--retry [0-9]*/--max-tries=15/g' scripts/download.pl || true

          cat > feeds.conf.default << 'EOF'
          src-git packages https://github.com/immortalwrt/packages.git;openwrt-24.10
          src-git luci https://github.com/immortalwrt/luci.git;openwrt-24.10
          src-git routing https://github.com/openwrt/routing.git;openwrt-24.10
          src-git telephony https://github.com/openwrt/telephony.git;openwrt-24.10
          EOF

          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Write .config
        working-directory: openwrt
        run: |
          cat > .config << 'EOF'
          CONFIG_TARGET_mediatek=y
          CONFIG_TARGET_mediatek_filogic=y
          CONFIG_TARGET_mediatek_filogic_DEVICE_cudy_tr3000-v1=y
          CONFIG_IB=y
          CONFIG_IB_STANDALONE=y
          CONFIG_PACKAGE_luci=y
          CONFIG_PACKAGE_luci-theme-argon=y
          CONFIG_PACKAGE_dnsmasq-full=y
          CONFIG_PACKAGE_firewall4=y
          CONFIG_PACKAGE_kmod-usb3=y
          CONFIG_PACKAGE_kmod-mt7915e=y
          CONFIG_PACKAGE_kmod-mt7981-firmware=y
          CONFIG_PACKAGE_mt7981-wo-firmware=y
          CONFIG_PACKAGE_automount=y
          CONFIG_PACKAGE_kmod-usb-net-cdc-ether=y
          CONFIG_PACKAGE_kmod-usb-net-rndis=y
          CONFIG_PACKAGE_kmod-usb-net-qmi-wwan=y
          CONFIG_PACKAGE_kmod-usb-serial-option=y
          CONFIG_PACKAGE_openssh-sftp-server=y
          CONFIG_PACKAGE_curl=y
          CONFIG_PACKAGE_ip-full=y
          CONFIG_PACKAGE_kmod-nft-tproxy=y
          CONFIG_PACKAGE_kmod-tun=y
          EOF
          make defconfig

      - name: Download (stable mode)
        working-directory: openwrt
        run: |
          make download -j1 V=s || true
          make download -j$(nproc) V=s

      - name: Build
        working-directory: openwrt
        run: make -j$(nproc) V=s

      - name: Collect & Upload
        working-directory: openwrt
        run: |
          mkdir -p /tmp/output
          find bin/targets/mediatek/filogic -name "immortalwrt-imagebuilder-*.tar.zst" -exec cp -v {} /tmp/output/ \;
          find bin/targets/mediatek/filogic -name "*cudy*tr3000*sysupgrade*" -exec cp -v {} /tmp/output/ \; || true
          ls -lah /tmp/output/

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: immortalwrt-24.10.6-490MB-IB
          path: /tmp/output/
          retention-days: 30

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ib-24.10.6-490MB-${{ github.run_number }}
          name: Custom IB 24.10.6 Cudy TR3000 490MB UBI
          body: |
            定制 Image Builder（490MB UBI 已打补丁）
            使用 aria2 + 全量镜像加速，下载阶段极稳
          files: /tmp/output/*
