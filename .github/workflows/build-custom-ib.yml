name: Build Custom ImmortalWrt 24.10.6 ImageBuilder (490MB UBI)

on:
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

permissions:
  contents: write

jobs:
  build-ib:
    runs-on: ubuntu-22.04
    timeout-minutes: 360

    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/boost /opt/hostedtoolcache/CodeQL
          sudo apt-get clean
          df -h

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison g++ gawk gcc-multilib g++-multilib gettext git libncurses5-dev libssl-dev python3-setuptools rsync swig unzip zlib1g-dev file wget curl qemu-utils libelf-dev

      - name: Clone ImmortalWrt 24.10.6
        run: |
          git clone --depth=1 --branch v24.10.6 https://github.com/immortalwrt/immortalwrt.git openwrt

      - name: Force patch UBI 490MB + IMAGE_SIZE
        working-directory: openwrt
        run: |
          set -e
          DTS_FILE=$(find target/linux/mediatek/dts -name "mt7981b-cudy-tr3000-v1.dts" | head -1)
          echo "DTS_FILE=$DTS_FILE"
          test -n "$DTS_FILE" || { echo "ERROR: DTS not found"; exit 1; }
          sed -i 's/reg = <0x5c0000 0x4000000>/reg = <0x5c0000 0x1EA00000>/g' "$DTS_FILE"
          sed -i 's/0x4000000/0x1EA00000/g' "$DTS_FILE"
          grep -q "0x1EA00000" "$DTS_FILE" || { echo "ERROR: DTS patch failed"; exit 1; }
          echo "SUCCESS: DTS UBI = 0x1EA00000"

          MK_FILE="target/linux/mediatek/image/filogic.mk"
          awk '
            /^define Device\/cudy_tr3000-v1$/ { in_dev=1 }
            in_dev && /^endef$/ { in_dev=0 }
            in_dev && /IMAGE_SIZE := 65536k/ { sub(/65536k/, "502784k") }
            { print }
          ' "$MK_FILE" > "$MK_FILE.tmp" && mv "$MK_FILE.tmp" "$MK_FILE"
          grep -A15 "Device/cudy_tr3000-v1$" "$MK_FILE" | grep -q "502784k" || {
            echo "ERROR: IMAGE_SIZE patch failed"; exit 1
          }
          echo "SUCCESS: IMAGE_SIZE = 502784k"

      - name: Minimal feeds (just enough for IB)
        working-directory: openwrt
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Write .config (focus on Image Builder + base device)
        working-directory: openwrt
        run: |
          cat > .config << 'EOF'
          CONFIG_TARGET_mediatek=y
          CONFIG_TARGET_mediatek_filogic=y
          CONFIG_TARGET_mediatek_filogic_DEVICE_cudy_tr3000-v1=y

          # 关键：生成 Image Builder
          CONFIG_IB=y
          CONFIG_IB_STANDALONE=y

          # 基础必要包（IB 会带上）
          CONFIG_PACKAGE_luci=y
          CONFIG_PACKAGE_luci-compat=y
          CONFIG_PACKAGE_luci-theme-argon=y
          CONFIG_PACKAGE_dnsmasq-full=y
          CONFIG_PACKAGE_firewall4=y
          CONFIG_PACKAGE_kmod-usb3=y
          CONFIG_PACKAGE_kmod-mt7915e=y
          CONFIG_PACKAGE_kmod-mt7981-firmware=y
          CONFIG_PACKAGE_mt7981-wo-firmware=y
          CONFIG_PACKAGE_automount=y
          CONFIG_PACKAGE_kmod-usb-net-cdc-ether=y
          CONFIG_PACKAGE_kmod-usb-net-rndis=y
          CONFIG_PACKAGE_kmod-usb-net-qmi-wwan=y
          CONFIG_PACKAGE_kmod-usb-serial-option=y
          CONFIG_PACKAGE_openssh-sftp-server=y
          CONFIG_PACKAGE_curl=y
          CONFIG_PACKAGE_ip-full=y
          CONFIG_PACKAGE_kmod-nft-tproxy=y
          CONFIG_PACKAGE_kmod-tun=y

          # 可选：多编一些 kmod 方便后续
          CONFIG_ALL_KMODS=n
          EOF
          make defconfig

      - name: Download + Build (produces Image Builder)
        working-directory: openwrt
        run: |
          make download -j$(nproc) V=s
          make -j$(nproc) V=s 2>&1 | tee build.log

      - name: Collect Image Builder
        working-directory: openwrt
        run: |
          set -e
          ls -lah bin/targets/mediatek/filogic/
          IB=$(find bin/targets/mediatek/filogic -name "immortalwrt-imagebuilder-*-mediatek-filogic*.tar.zst" | head -1)
          test -n "$IB" || { echo "ERROR: Image Builder not found!"; tail -50 build.log; exit 1; }
          echo "Found IB: $IB"
          mkdir -p /tmp/ib
          cp -v "$IB" /tmp/ib/
          # 顺便把对应的 sysupgrade 也带上（方便直接测）
          cp -v bin/targets/mediatek/filogic/*cudy*tr3000*sysupgrade* /tmp/ib/ 2>/dev/null || true
          ls -lah /tmp/ib/

      - name: Upload Custom Image Builder
        uses: actions/upload-artifact@v4
        with:
          name: immortalwrt-24.10.6-cudy-tr3000-490MB-ImageBuilder
          path: /tmp/ib/
          if-no-files-found: error
          retention-days: 30

      - name: Create Release (optional)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ib-24.10.6-490MB-${{ github.run_number }}
          name: Custom ImmortalWrt 24.10.6 ImageBuilder (Cudy TR3000 490MB UBI)
          body: |
            定制 Image Builder，已包含 490MB UBI 补丁（DTS 0x1EA00000 + IMAGE_SIZE 502784k）
            解压后直接使用，后续加包只需几分钟。
            PROFILE=cudy_tr3000-v1
          files: /tmp/ib/*
          draft: false
          prerelease: false
