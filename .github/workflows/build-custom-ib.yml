name: Build Custom ImmortalWrt 24.10.6 ImageBuilder (490MB UBI)

on:
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

permissions:
  contents: write

jobs:
  build-ib:
    runs-on: ubuntu-22.04
    timeout-minutes: 360

    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/boost /opt/hostedtoolcache
          sudo rm -rf /usr/share/swift /usr/local/.ghcup /opt/microsoft
          sudo apt-get clean
          sudo docker system prune -af || true
          df -h

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential clang flex bison g++ gawk \
            gcc-multilib g++-multilib gettext git \
            libncurses5-dev libssl-dev python3-setuptools \
            rsync swig unzip zlib1g-dev file wget curl \
            qemu-utils libelf-dev time

      - name: Clone ImmortalWrt
        run: |
          git clone --depth=1 --branch v24.10.6 https://github.com/immortalwrt/immortalwrt.git openwrt

      - name: Cache dl
        uses: actions/cache@v4
        with:
          path: openwrt/dl
          key: immortalwrt-24.10.6-dl-${{ hashFiles('openwrt/feeds.conf.default') }}
          restore-keys: |
            immortalwrt-24.10.6-dl-

      - name: Apply 490MB UBI patch
        working-directory: openwrt
        run: |
          set -e
          DTS=$(find target/linux/mediatek/dts -name "*cudy-tr3000-v1.dts" | head -1)
          echo "Patching DTS: $DTS"
          sed -i 's/reg = <0x5c0000 0x4000000>/reg = <0x5c0000 0x1EA00000>/g' "$DTS"
          sed -i 's/0x4000000/0x1EA00000/g' "$DTS"
          grep -q "0x1EA00000" "$DTS" || { echo "DTS patch failed"; exit 1; }
          echo "DTS OK"

          MK=target/linux/mediatek/image/filogic.mk
          sed -i '/Device\/cudy_tr3000-v1/,/endef/{s/IMAGE_SIZE := 65536k/IMAGE_SIZE := 502784k/}' "$MK"
          grep -A20 "Device/cudy_tr3000-v1" "$MK" | grep -q "502784k" || { echo "IMAGE_SIZE patch failed"; exit 1; }
          echo "IMAGE_SIZE OK"

      - name: Use stable mirrors
        working-directory: openwrt
        run: |
          # 只替换已知慢/不稳定的源，不破坏脚本
          sed -i 's|https://downloads.openwrt.org|https://mirrors.tencent.com/openwrt|g' scripts/download.pl
          sed -i 's|http://downloads.openwrt.org|https://mirrors.tencent.com/openwrt|g' scripts/download.pl
          sed -i 's|https://cdn.kernel.org|https://mirrors.tencent.com/kernel|g' scripts/download.pl || true
          sed -i 's|download.savannah.nongnu.org|mirrors.tencent.com/nongnu|g' scripts/download.pl || true

          # 提高 curl 重试
          sed -i 's/--connect-timeout 20/--connect-timeout 40/g' scripts/download.pl || true
          sed -i 's/--retry 5/--retry 10/g' scripts/download.pl || true

          cat > feeds.conf.default << 'EOF'
          src-git packages https://github.com/immortalwrt/packages.git;openwrt-24.10
          src-git luci https://github.com/immortalwrt/luci.git;openwrt-24.10
          src-git routing https://github.com/openwrt/routing.git;openwrt-24.10
          src-git telephony https://github.com/openwrt/telephony.git;openwrt-24.10
          EOF

          ./scripts/
