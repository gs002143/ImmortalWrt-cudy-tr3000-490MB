name: Build Custom IB 24.10.6 490MB

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 360

    steps:
      - name: Free space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache
          sudo apt-get clean
          df -h

      - name: Install deps
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison g++ gawk \
            gcc-multilib g++-multilib gettext git libncurses5-dev libssl-dev \
            python3-setuptools rsync swig unzip zlib1g-dev file wget curl \
            qemu-utils libelf-dev

      - name: Clone
        run: git clone --depth=1 --branch v24.10.6 https://github.com/immortalwrt/immortalwrt.git openwrt

      - name: Patch UBI 490MB
        working-directory: openwrt
        run: |
          set -e
          DTS=$(find target/linux/mediatek/dts -name "*cudy-tr3000-v1.dts" | head -1)
          echo "Found DTS: $DTS"
          sed -i 's/0x4000000/0x1EA00000/g' "$DTS"
          grep -q "0x1EA00000" "$DTS"
          echo "DTS patched"

          sed -i '/Device\/cudy_tr3000-v1/,/endef/{s/IMAGE_SIZE := 65536k/IMAGE_SIZE := 502784k/}' target/linux/mediatek/image/filogic.mk
          grep -A10 "cudy_tr3000-v1" target/linux/mediatek/image/filogic.mk | grep 502784k
          echo "IMAGE_SIZE patched"

      - name: Feeds
        working-directory: openwrt
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Config
        working-directory: openwrt
        run: |
          cat > .config << 'EOF'
          CONFIG_TARGET_mediatek=y
          CONFIG_TARGET_mediatek_filogic=y
          CONFIG_TARGET_mediatek_filogic_DEVICE_cudy_tr3000-v1=y
          CONFIG_IB=y
          CONFIG_IB_STANDALONE=y
          CONFIG_PACKAGE_luci=y
          CONFIG_PACKAGE_luci-theme-argon=y
          CONFIG_PACKAGE_dnsmasq-full=y
          CONFIG_PACKAGE_firewall4=y
          CONFIG_PACKAGE_kmod-usb3=y
          CONFIG_PACKAGE_kmod-mt7915e=y
          CONFIG_PACKAGE_kmod-mt7981-firmware=y
          CONFIG_PACKAGE_mt7981-wo-firmware=y
          CONFIG_PACKAGE_automount=y
          CONFIG_PACKAGE_kmod-usb-net-cdc-ether=y
          CONFIG_PACKAGE_kmod-usb-net-rndis=y
          CONFIG_PACKAGE_kmod-usb-net-qmi-wwan=y
          CONFIG_PACKAGE_kmod-usb-serial-option=y
          CONFIG_PACKAGE_openssh-sftp-server=y
          CONFIG_PACKAGE_curl=y
          CONFIG_PACKAGE_ip-full=y
          CONFIG_PACKAGE_kmod-nft-tproxy=y
          CONFIG_PACKAGE_kmod-tun=y
          EOF
          make defconfig

      - name: Download
        working-directory: openwrt
        run: make download -j$(nproc)

      - name: Build
        working-directory: openwrt
        run: make -j$(nproc) V=s

      - name: Collect
        working-directory: openwrt
        run: |
          mkdir -p /tmp/out
          cp -v bin/targets/mediatek/filogic/immortalwrt-imagebuilder-*.tar.zst /tmp/out/ || true
          cp -v bin/targets/mediatek/filogic/*cudy*tr3000*sysupgrade* /tmp/out/ || true
          ls -lah /tmp/out/
          ls /tmp/out/immortalwrt-imagebuilder-*.tar.zst

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: custom-ib-490MB
          path: /tmp/out/
          retention-days: 15

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ib-24.10.6-490MB-${{ github.run_number }}
          name: Custom IB 24.10.6 490MB
          files: /tmp/out/*
